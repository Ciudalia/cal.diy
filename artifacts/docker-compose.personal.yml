# Cal.diy — Compose AUXILIAR de BUILD/pruebas locales (NO es el destino VPS).
# Para despliegue destino: usar artifacts/docker-compose.destino.yml (sin build:,
# BD/Redis sin ports, Mailpit sumidero, app solo 127.0.0.1).
# NO usar imagen Scarf/DockerHub no auditada: construye desde este código.

name: caldiy-personal

volumes:
  database-data:
  redis-data:

networks:
  stack:
    name: caldiy-personal-stack
    driver: bridge
    internal: false

services:
  database:
    container_name: caldiy-personal-db
    image: postgres:16-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    restart: unless-stopped
    volumes:
      - database-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - stack
    ports:
      # Solo loopback: build --network=host y herramientas locales
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    container_name: caldiy-personal-redis
    image: redis:7-bookworm@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks:
      - stack
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  calcom:
    container_name: caldiy-personal-app
    image: caldiy-personal:local
    build:
      context: ..
      dockerfile: artifacts/Dockerfile
      network: host
      args:
        NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL:-http://127.0.0.1:3000}
        NEXT_PUBLIC_API_V2_URL: ${NEXT_PUBLIC_API_V2_URL:-http://127.0.0.1:3000/api/v2}
        NEXT_PUBLIC_LICENSE_CONSENT: ${NEXT_PUBLIC_LICENSE_CONSENT:-agree}
        CALCOM_TELEMETRY_DISABLED: ${CALCOM_TELEMETRY_DISABLED:-1}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
        DATABASE_URL: ${BUILD_DATABASE_URL}
        CSP_POLICY: ${CSP_POLICY:-}
        ORGANIZATIONS_ENABLED: ${ORGANIZATIONS_ENABLED:-}
        NEXT_PUBLIC_SINGLE_ORG_SLUG: ${NEXT_PUBLIC_SINGLE_ORG_SLUG:-}
        MAX_OLD_SPACE_SIZE: ${MAX_OLD_SPACE_SIZE:-6144}
    restart: unless-stopped
    networks:
      - stack
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - secrets-local/env.personal
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_HOST: database:5432
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL:-http://127.0.0.1:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://127.0.0.1:3000}
      CALCOM_TELEMETRY_DISABLED: "1"
      EMAIL_SERVER_HOST: 127.0.0.1
      EMAIL_SERVER_PORT: "1025"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
